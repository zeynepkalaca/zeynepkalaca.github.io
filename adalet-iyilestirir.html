<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Zeynep Kalaça's Adalet İyileştirir mapping project">
  <meta name="author" content="Zeynep Kalaça">
  <title>Zeynep Kalaça / adalet iyileştirir</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>

  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    /* CSS Variables matching projects.html */
    :root {
      --bg-color: #ffffff;
      --text-color: #000000;
      --link-color: blue;
      --contact-link-color: #333333;
      --border-color: #ccc;
      --button-bg: #efefef;
      --button-border: #767676;
      --accent-color: #cc0000;
      --panel-bg: #f9f9f9;
      --input-bg: #ffffff;
    }

    [data-theme="dark"] {
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --link-color: #64b5f6;
      --contact-link-color: #cccccc;
      --border-color: #333333;
      --button-bg: #2b2b2b;
      --button-border: #555555;
      --accent-color: #ff6666;
      --panel-bg: #1a1a1a;
      --input-bg: #1e1e1e;
    }

    body { 
      font-family: "Helvetica", "Arial", sans-serif; 
      background-color: var(--bg-color); 
      color: var(--text-color);
      margin: 60px 100px; 
      font-size: 20px; 
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    h2 {
      font-size: 32px; 
      margin-top: 0;
    }

    p { 
      margin: 20px 0; 
      font-size: 20px; 
    }

    a { 
      color: var(--link-color); 
      text-decoration: underline; 
      font-size: 20px; 
    }

    .theme-toggle-container {
      position: absolute;
      top: 40px;
      right: 100px;
    }

    .back-link {
      font-family: "Consolas", "Courier New", monospace; 
      text-decoration: none;
      color: var(--contact-link-color);
      font-weight: 500;
      display: inline-block;
    }

    .back-link:hover {
      text-decoration: underline;
      color: var(--link-color);
    }

    .accent-link {
      color: var(--accent-color) !important;
      text-decoration: none;
    }

    .accent-link:hover {
      text-decoration: underline;
    }

    hr {
      border: 0;
      border-top: 1px solid var(--border-color);
      margin: 30px 0;
    }

    button#theme-toggle {
      font-size: 16px; 
      padding: 8px 16px;
      cursor: pointer;
      background-color: var(--button-bg);
      color: var(--text-color);
      border: 1px solid var(--button-border);
      border-radius: 4px;
    }

    /* Layout Containers */
    .dashboard-layout {
      display: flex;
      gap: 40px;
      align-items: flex-start;
    }

    .sidebar-column {
      width: 450px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .map-column {
      flex: 1;
      height: 700px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* Controls & Inputs */
    .control-box {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      background-color: var(--panel-bg);
    }

    input[type="text"], select {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      background-color: var(--input-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      margin-bottom: 15px;
      box-sizing: border-box;
    }

    .filter-row {
      display: flex;
      gap: 10px;
    }

    .filter-row select {
      flex: 1;
    }

    /* Tabs */
    .tabs-nav {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 15px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      font-size: 16px;
      color: var(--text-color);
      cursor: pointer;
      opacity: 0.7;
    }

    .tab-btn.active {
      opacity: 1;
      font-weight: bold;
      border-bottom: 2px solid var(--accent-color);
      color: var(--accent-color);
    }

    /* Incident List Container */
    .incident-list {
      max-height: 450px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 5px;
    }

    .incident-card {
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 15px;
      background-color: var(--bg-color);
      cursor: pointer;
      transition: border-color 0.2s ease, transform 0.2s ease;
      font-size: 16px;
    }

    .incident-card:hover {
      border-color: var(--accent-color);
      transform: translateY(-2px);
    }

    .export-btns {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .export-btn {
      flex: 1;
      padding: 8px 12px;
      font-size: 15px;
      background-color: var(--button-bg);
      color: var(--text-color);
      border: 1px solid var(--button-border);
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
    }

    .export-btn:hover {
      background-color: var(--accent-color);
      color: #fff;
      border-color: var(--accent-color);
    }

    /* Responsive */
    @media (max-width: 1024px) {
      body { margin: 30px; }
      .theme-toggle-container { top: 25px; right: 30px; }
      .dashboard-layout { flex-direction: column; }
      .sidebar-column { width: 100%; }
      .map-column { height: 500px; width: 100%; }
    }
  </style>
</head>

  <!-- Theme Toggle -->
  <div class="theme-toggle-container">
    <button id="theme-toggle" onclick="toggleTheme()">🌙 dark</button>
  </div>

  <h2>"adalet iyileştirir"</h2>
  <p><a href="projects.html" class="back-link">← projects</a></p>
  <hr>

  <div class="dashboard-layout">
    
    <!-- Left Column: Controls & List / Charts -->
    <div class="sidebar-column">
      <div class="control-box">
        <p style="margin-top: 0; font-size: 18px; font-weight: bold;">Filters & Search</p>
        
        <input type="text" id="searchInput" placeholder="Search by victim name, district, province...">

        <div class="filter-row">
          <select id="categoryFilter">
            <option value="">All Categories (51 Cases)</option>
            <option value="Landmines & UXO Explosions">Landmines & UXO (28)</option>
            <option value="Armored Vehicle Collisions">Armored Vehicles (23)</option>
          </select>

          <select id="provinceFilter">
            <option value="">All Provinces</option>
          </select>
        </div>

        <div class="tabs-nav">
          <button onclick="switchTab('table')" id="tabBtnTable" class="tab-btn active">Incidents List (<span id="recordCount">51</span>)</button>
          <button onclick="switchTab('charts')" id="tabBtnCharts" class="tab-btn">Analytics</button>
        </div>

        <!-- Incidents List View -->
        <div id="tabContentTable" class="incident-list">
          <!-- Populated via JavaScript -->
        </div>

        <!-- Analytics Charts View -->
        <div id="tabContentCharts" style="display: none;" class="incident-list">
          <div style="margin-bottom: 20px;">
            <p style="font-size: 16px; font-weight: bold; margin-bottom: 5px;">Category Breakdown</p>
            <div style="height: 180px;"><canvas id="categoryChart"></canvas></div>
          </div>
          <div>
            <p style="font-size: 16px; font-weight: bold; margin-bottom: 5px;">Timeline Trend (2000–2015)</p>
            <div style="height: 180px;"><canvas id="yearChart"></canvas></div>
          </div>
        </div>

        <!-- Export Buttons -->
        <div class="export-btns">
          <button onclick="exportGeoJSON()" class="export-btn">📥 GeoJSON</button>
          <button onclick="exportCSV()" class="export-btn">📊 CSV</button>
        </div>
      </div>
    </div>

    <!-- Right Column: Interactive Map -->
    <div class="map-column">
      <div id="map"></div>
    </div>

  </div>

  <!-- Leaflet & Clustering Scripts -->

      if (currentTheme === 'dark') {
        toggleBtn.textContent = '☀️ light';
      }

    function toggleTheme() {
      let theme = document.documentElement.getAttribute('data-theme');
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('theme', 'light');
        toggleBtn.textContent = '🌙 dark';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');

    // Initialize Map
    const map = L.map('map', { center: [38.2, 41.2], zoom: 7 });
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri',
      maxZoom: 16
    }).addTo(map);

    const markersCluster = L.markerClusterGroup();
    map.addLayer(markersCluster);

    let catChart = null, yrChart = null;

    // Populate Province Options
    const provSelect = document.getElementById('provinceFilter');
    Object.keys(provinceCoords).sort().forEach(p => {
      const opt = document.createElement('option');
      opt.value = p; opt.textContent = p;
      provSelect.appendChild(opt);
    });

    function render(data) {
      markersCluster.clearLayers();
      const list = document.getElementById('tabContentTable');
      list.innerHTML = '';
      document.getElementById('recordCount').textContent = data.length;

      data.forEach(inc => {
        const baseCoord = provinceCoords[inc.province] || [38.5, 41.5];
        const lat = baseCoord[0] + (Math.random() - 0.5) * 0.12;
        const lng = baseCoord[1] + (Math.random() - 0.5) * 0.12;
        const color = inc.type.includes("Landmines") ? "#cc0000" : "#d97706";

        const marker = L.circleMarker([lat, lng], {
          radius: 7, fillColor: color, color: "#fff", weight: 1, fillOpacity: 0.9
        });

        marker.bindPopup(`
          <div style="font-size: 14px; color: #111;">
            <strong style="color: #cc0000; font-size: 15px;">${inc.name} (${inc.age} y/o)</strong><br>
            <strong>Location:</strong> ${inc.province} / ${inc.district}<br>
            <strong>Date:</strong> ${inc.date}<br>
            <strong>Type:</strong> ${inc.type}<br>
            <p style="margin: 5px 0 0 0;">${inc.desc}</p>
          </div>
        `);
        markersCluster.addLayer(marker);

        const card = document.createElement('div');
        card.className = "incident-card";
        card.innerHTML = `
          <span class="accent-link" style="font-weight: bold; display: block; margin-bottom: 4px;">${inc.name} (${inc.age} y/o)</span>
          <div style="font-size: 14px; opacity: 0.8;">📍 ${inc.province}, ${inc.district} &bull; ${inc.date}</div>
          <div style="font-size: 13px; font-style: italic; margin-top: 4px; opacity: 0.7;">${inc.type}</div>
        `;
        card.onclick = () => { map.setView([lat, lng], 10); marker.openPopup(); };
        list.appendChild(card);
      });

      updateCharts(data);
    }

    function updateCharts(data) {
      const catCounts = { "Landmines & UXO Explosions": 0, "Armored Vehicle Collisions": 0 };
      const yrCounts = {}; for(let y=2000; y<=2015; y++) yrCounts[y] = 0;

      data.forEach(inc => {
        if(catCounts[inc.type] !== undefined) catCounts[inc.type]++;
        const yr = inc.date.split('.')[2];
        if(yrCounts[yr] !== undefined) yrCounts[yr]++;
      });

      if(catChart) catChart.destroy();
      catChart = new Chart(document.getElementById('categoryChart'), {
        type: 'doughnut',
        data: { labels: Object.keys(catCounts), datasets: [{ data: Object.values(catCounts), backgroundColor: ['#cc0000', '#d97706'] }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11 } } } } }
      });

      if(yrChart) yrChart.destroy();
      yrChart = new Chart(document.getElementById('yearChart'), {
        type: 'bar',
        data: { labels: Object.keys(yrCounts), datasets: [{ data: Object.values(yrCounts), backgroundColor: '#cc0000', borderRadius: 2 }] },
        options: { responsive: true, maintainAspectRatio: false, scales: { x: { ticks: { font: { size: 10 } } }, y: { ticks: { font: { size: 10 } } } }, plugins: { legend: { display: false } } }
      });
    }

    function filterData() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const c = document.getElementById('categoryFilter').value;
      const p = document.getElementById('provinceFilter').value;

      const filtered = incidents.filter(i => 
        (i.name.toLowerCase().includes(q) || i.province.toLowerCase().includes(q) || i.district.toLowerCase().includes(q) || i.date.includes(q)) &&
        (!c || i.type === c) && (!p || i.province === p)
      );
      render(filtered);
    }

    document.getElementById('searchInput').addEventListener('input', filterData);
    document.getElementById('categoryFilter').addEventListener('change', filterData);
    document.getElementById('provinceFilter').addEventListener('change', filterData);

    function switchTab(tab) {
      const isTable = tab === 'table';
      document.getElementById('tabContentTable').style.display = isTable ? 'flex' : 'none';
      document.getElementById('tabContentCharts').style.display = isTable ? 'none' : 'flex';
      document.getElementById('tabBtnTable').className = isTable ? 'tab-btn active' : 'tab-btn';
      document.getElementById('tabBtnCharts').className = isTable ? 'tab-btn' : 'tab-btn active';
    }

    function exportGeoJSON() {
      const geojson = {
        type: "FeatureCollection",
        features: incidents.map(inc => ({
          type: "Feature",
          geometry: { type: "Point", coordinates: [(provinceCoords[inc.province]||[38.5,41.5])[1], (provinceCoords[inc.province]||[38.5,41.5])[0]] },
          properties: inc
        }))
      };
      const blob = new Blob([JSON.stringify(geojson, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'adalet_iyilestirir_51_cases.geojson';
      a.click();
    }

    function exportCSV() {
      let csv = 'Name,Age,Province,District,Date,Type,Description\n';
      incidents.forEach(inc => {
        csv += `"${inc.name}","${inc.age}","${inc.province}","${inc.district}","${inc.date}","${inc.type}","${inc.desc}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'adalet_iyilestirir_51_cases.csv';
      a.click();
    }

    // Initial load and sizing fix
    window.addEventListener('load', () => {
      render(incidents);
      setTimeout(() => { map.invalidateSize(); }, 200);
    });
  </script>
</body>
</html>
