<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeynep Kalaça / "adalet iyileştirir"</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧿</text></svg>">
  
  <!-- Leaflet CSS & MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  
  <!-- Tailwind CSS & Chart.js -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg-color: #ffffff;
      --panel-bg: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #000000;
      --border-color: #e2e8f0;
      --button-bg: #efefef;
      --button-border: #767676;
    }

    [data-theme="dark"] {
      --bg-color: #0f172a;
      --panel-bg: #1e293b;
      --card-bg: #334155;
      --text-color: #e0e0e0;
      --border-color: #334155;
      --button-bg: #2b2b2b;
      --button-border: #555555;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: "Helvetica", "Arial", sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    #map {
      height: calc(100vh - 4.5rem);
      width: 100%;
      border-radius: 0.5rem;
    }

    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #64748b; border-radius: 3px; }
  </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

  <!-- Header Navigation -->
  <header class="bg-slate-900 border-b border-slate-800 px-6 py-3 flex items-center justify-between text-white z-20">
    <div class="flex items-center space-x-4">
      <a href="index.html" class="text-slate-400 hover:text-white transition font-mono text-sm">&larr; home</a>
      <div class="h-4 w-px bg-slate-700"></div>
      <div>
        <h1 class="text-base font-bold">Child & Youth Deaths: Landmines, UXO & Armored Vehicles (2000–2015)</h1>
        <p class="text-xs text-slate-400">Source: Hafıza Merkezi ("Adalet İyileştirir") Database</p>
      </div>
    </div>
    
    <div class="flex items-center space-x-3">
      <button onclick="exportGeoJSON()" class="bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded text-xs font-semibold transition">
        📥 Export GeoJSON
      </button>
      <button onclick="exportCSV()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white px-3 py-1.5 rounded text-xs font-semibold transition">
        📊 Export CSV
      </button>
      <button id="theme-toggle" onclick="toggleTheme()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white px-3 py-1.5 rounded text-xs font-semibold transition">
        🌙 dark
      </button>
    </div>
  </header>

  <!-- Main Grid Layout -->
  <div class="flex flex-1 overflow-hidden">
    
    <!-- Sidebar -->
    <aside class="w-full lg:w-4/12 bg-slate-900 text-slate-200 border-r border-slate-800 flex flex-col z-10">
      
      <!-- Filter Inputs -->
      <div class="p-4 border-b border-slate-800 space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Filters & Search</span>
          <span id="recordCount" class="text-xs font-bold bg-rose-500/20 text-rose-400 px-2 py-0.5 rounded-full">51 Cases</span>
        </div>
        
        <input type="text" id="searchInput" placeholder="Search by victim name, district, province..." 
          class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-1.5 text-xs text-slate-100 placeholder-slate-400 focus:outline-none focus:border-rose-500">

        <div class="grid grid-cols-2 gap-2 text-xs">
          <select id="categoryFilter" class="bg-slate-800 border border-slate-700 rounded px-2 py-1.5 text-slate-200">
            <option value="">All Categories (51)</option>
            <option value="Landmines & UXO Explosions">Landmines & UXO (28)</option>
            <option value="Armored Vehicle Collisions">Armored Vehicles (23)</option>
          </select>

          <select id="provinceFilter" class="bg-slate-800 border border-slate-700 rounded px-2 py-1.5 text-slate-200">
            <option value="">All Provinces</option>
          </select>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <div class="flex border-b border-slate-800 bg-slate-950/50">
        <button onclick="switchTab('table')" id="tabBtnTable" class="flex-1 py-2 text-xs font-bold text-rose-400 border-b-2 border-rose-500 transition">Incidents List</button>
        <button onclick="switchTab('charts')" id="tabBtnCharts" class="flex-1 py-2 text-xs font-medium text-slate-400 transition">Analytics</button>
      </div>

      <!-- Incident List -->
      <div id="tabContentTable" class="flex-1 overflow-y-auto custom-scrollbar p-3">
        <div id="incidentList" class="space-y-2"></div>
      </div>

      <!-- Charts Area -->
      <div id="tabContentCharts" class="flex-1 overflow-y-auto custom-scrollbar p-4 hidden space-y-6">
        <div>
          <h3 class="text-xs font-bold text-slate-400 uppercase mb-2">Category Breakdown</h3>
          <div class="bg-slate-950 p-3 rounded border border-slate-800 h-44">
            <canvas id="categoryChart"></canvas>
          </div>
        </div>
        <div>
          <h3 class="text-xs font-bold text-slate-400 uppercase mb-2">Timeline Trend (2000–2015)</h3>
          <div class="bg-slate-950 p-3 rounded border border-slate-800 h-44">
            <canvas id="yearChart"></canvas>
          </div>
        </div>
      </div>
    </aside>

    <!-- Interactive Map Display -->
    <main class="flex-1 relative p-2 bg-slate-950">
      <div id="map"></div>
    </main>
  </div>

    // Initialize Map
    const map = L.map('map').setView([38.5, 41.5], 7);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap &copy; CARTO'
    }).addTo(map);

    const markersCluster = L.markerClusterGroup();
    map.addLayer(markersCluster);

    let catChart = null, yrChart = null;

    // Populate Province Select Options
    const provSelect = document.getElementById('provinceFilter');
    Object.keys(provinceCoords).sort().forEach(p => {
      const opt = document.createElement('option');
      opt.value = p; opt.textContent = p;
      provSelect.appendChild(opt);
    });

    function render(data) {
      markersCluster.clearLayers();
      const list = document.getElementById('incidentList');
      list.innerHTML = '';
      document.getElementById('recordCount').textContent = `${data.length} Cases`;

      data.forEach(inc => {
        const baseCoord = provinceCoords[inc.province] || [38.5, 41.5];
        const lat = baseCoord[0] + (Math.random() - 0.5) * 0.12;
        const lng = baseCoord[1] + (Math.random() - 0.5) * 0.12;
        const color = inc.type.includes("Landmines") ? "#f43f5e" : "#f59e0b";

        const marker = L.circleMarker([lat, lng], {
          radius: 7, fillColor: color, color: "#fff", weight: 1, fillOpacity: 0.85
        });

        marker.bindPopup(`
          <div class="p-1 space-y-1 text-xs">
            <div class="font-bold text-rose-400 text-sm">${inc.name} (${inc.age} y/o)</div>
            <div><strong>Location:</strong> ${inc.province} (${inc.district})</div>
            <div><strong>Date:</strong> ${inc.date}</div>
            <div><strong>Category:</strong> ${inc.type}</div>
            <p class="pt-1 text-slate-300 border-t border-slate-700">${inc.desc}</p>
          </div>
        `);
        markersCluster.addLayer(marker);

        const card = document.createElement('div');
        card.className = "bg-slate-800/60 hover:bg-slate-800 border border-slate-700/60 rounded p-2.5 cursor-pointer text-xs space-y-1";
        card.innerHTML = `
          <div class="flex justify-between font-bold text-slate-200">
            <span>${inc.name}</span>
            <span class="text-[10px] bg-slate-900 px-1.5 py-0.5 rounded text-slate-400">${inc.date}</span>
          </div>
          <div class="flex justify-between text-slate-400">
            <span>📍 ${inc.province} (${inc.district})</span>
            <span class="text-rose-400 font-semibold">${inc.age} y/o</span>
          </div>
          <div class="text-[11px] text-slate-300 italic">${inc.type}</div>
        `;
        card.onclick = () => { map.setView([lat, lng], 11); marker.openPopup(); };
        list.appendChild(card);
      });

      updateCharts(data);
    }

    function updateCharts(data) {
      const catCounts = { "Landmines & UXO Explosions": 0, "Armored Vehicle Collisions": 0 };
      const yrCounts = {}; for(let y=2000; y<=2015; y++) yrCounts[y] = 0;

      data.forEach(inc => {
        if(catCounts[inc.type] !== undefined) catCounts[inc.type]++;
        const yr = inc.date.split('.')[2];
        if(yrCounts[yr] !== undefined) yrCounts[yr]++;
      });

      if(catChart) catChart.destroy();
      catChart = new Chart(document.getElementById('categoryChart'), {
        type: 'doughnut',
        data: { labels: Object.keys(catCounts), datasets: [{ data: Object.values(catCounts), backgroundColor: ['#f43f5e', '#f59e0b'] }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#cbd5e1', font: { size: 9 } } } } }
      });

      if(yrChart) yrChart.destroy();
      yrChart = new Chart(document.getElementById('yearChart'), {
        type: 'bar',
        data: { labels: Object.keys(yrCounts), datasets: [{ data: Object.values(yrCounts), backgroundColor: '#f43f5e', borderRadius: 2 }] },
        options: { responsive: true, maintainAspectRatio: false, scales: { x: { ticks: { color: '#94a3b8', font: { size: 9 } } }, y: { ticks: { color: '#94a3b8', font: { size: 9 } } } }, plugins: { legend: { display: false } } }
      });
    }

    function filterData() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const c = document.getElementById('categoryFilter').value;
      const p = document.getElementById('provinceFilter').value;

      const filtered = incidents.filter(i => 
        (i.name.toLowerCase().includes(q) || i.province.toLowerCase().includes(q) || i.district.toLowerCase().includes(q) || i.date.includes(q)) &&
        (!c || i.type === c) && (!p || i.province === p)
      );
      render(filtered);
    }

    document.getElementById('searchInput').addEventListener('input', filterData);
    document.getElementById('categoryFilter').addEventListener('change', filterData);
    document.getElementById('provinceFilter').addEventListener('change', filterData);

    function switchTab(t) {
      document.getElementById('tabContentTable').classList.toggle('hidden', t !== 'table');
      document.getElementById('tabContentCharts').classList.toggle('hidden', t !== 'charts');
    }

    // Export GeoJSON
    function exportGeoJSON() {
      const geojson = {
        type: "FeatureCollection",
        features: incidents.map(inc => ({
          type: "Feature",
          geometry: { type: "Point", coordinates: [(provinceCoords[inc.province]||[38.5,41.5])[1], (provinceCoords[inc.province]||[38.5,41.5])[0]] },
          properties: inc
        }))
      };
      const blob = new Blob([JSON.stringify(geojson, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'adalet_iyilestirir_51_cases.geojson';
      a.click();
    }

    // Export CSV
    function exportCSV() {
      let csv = 'Name,Age,Province,District,Date,Type,Description\n';
      incidents.forEach(inc => {
        csv += `"${inc.name}","${inc.age}","${inc.province}","${inc.district}","${inc.date}","${inc.type}","${inc.desc}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'adalet_iyilestirir_51_cases.csv';
      a.click();
    }

    // Dark/Light Theme Switching
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      document.getElementById('theme-toggle').textContent = next === 'dark' ? '☀️ light' : '🌙 dark';
    }

    // Load initial theme
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    document.getElementById('theme-toggle').textContent = savedTheme === 'dark' ? '☀️ light' : '🌙 dark';

    render(incidents);
  </script>
</body>
</html>
