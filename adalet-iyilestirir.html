<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Documentation of child and youth casualties in Turkey (2000-2015)">
  <meta name="author" content="Zeynep Kalaça">

  <!-- Leaflet CSS & MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #1a1a1a;
      --secondary-text: #555555;
      --border-color: #d1d5db;
      --accent-red: #a81c1c;
      --font-serif: "Georgia", "Times New Roman", serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: "Consolas", "Courier New", monospace;
    }

    [data-theme="dark"] {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --secondary-text: #a0a0a0;
      --border-color: #333333;
      --accent-red: #e63946;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0 60px 40px 60px;
    }

    /* Top Horizontal Scrolling Photo Strip */
    .top-photo-strip {
      width: calc(100% + 120px);
      margin-left: -60px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 15px 60px;
      margin-bottom: 30px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: thin;
      box-sizing: border-box;
    }

    .top-photo-strip::-webkit-scrollbar { height: 6px; }
    .top-photo-strip::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }

    .strip-track {
      display: inline-flex;
      gap: 12px;
    }

    .strip-item {
      width: 100px;
      height: 100px;
      flex-shrink: 0;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
      background: var(--bg-color);
      cursor: pointer;
    }

    .strip-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.9);
      transition: filter 0.2s ease, transform 0.2s ease;
    }

    .strip-item:hover img {
      filter: brightness(1);
      transform: scale(1.05);
    }

    header {
      border-bottom: 2px solid var(--text-color);
      padding-bottom: 20px;
      margin-bottom: 30px;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: 32px;
      font-weight: 700;
      margin: 0 0 10px 0;
    }

    .meta-subtitle {
      font-size: 15px;
      color: var(--secondary-text);
      margin: 0;
    }

    .back-link {
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--secondary-text);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 15px;
    }

    .ucdp-grid {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 30px;
      align-items: start;
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 20px;
    }

    .panel-title {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: bold;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
      margin-top: 0;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
    }

    .case-count-badge {
      font-family: var(--font-mono);
      font-size: 12px;
      background: var(--accent-red);
      color: #fff;
      padding: 2px 8px;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"], select {
      font-family: var(--font-sans);
      font-size: 14px;
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-color);
      outline: none;
    }

    .tab-bar {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 15px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 0;
      background: none;
      border: none;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--secondary-text);
      cursor: pointer;
    }

    .tab-btn.active {
      color: var(--accent-red);
      font-weight: bold;
      border-bottom: 2px solid var(--accent-red);
    }

    .incident-scroll-list {
      max-height: 480px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .incident-card {
      border: 1px solid var(--border-color);
      padding: 12px;
      background: var(--card-bg);
      cursor: pointer;
    }

    .card-title {
      font-family: var(--font-serif);
      font-size: 16px;
      font-weight: bold;
      color: var(--accent-red);
      margin-bottom: 4px;
    }

    .card-meta {
      font-size: 13px;
      color: var(--secondary-text);
    }

    .map-box {
      border: 1px solid var(--border-color);
      height: 720px;
      position: relative;
      background: #e5e7eb;
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: 720px;
    }

    .theme-toggle-btn {
      position: absolute;
      top: 40px;
      right: 60px;
      font-family: var(--font-mono);
      font-size: 13px;
      padding: 6px 12px;
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      cursor: pointer;
      z-index: 5;
    }

    @media (max-width: 960px) {
      body { padding: 0 20px 20px 20px; }
      .top-photo-strip { width: calc(100% + 40px); margin-left: -20px; padding: 15px 20px; }
      .ucdp-grid { grid-template-columns: 1fr; }
      .map-box, #map { height: 450px; min-height: 450px; }
      .theme-toggle-btn { right: 20px; }
    }
  </style>
</head>

  <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn">🌙 dark</button>

  <a href="projects.html" class="back-link">← PROJECTS</a>

  <header>
    <h1>Turkey: Child & Youth Casualties (2000–2015)</h1>
    <p class="meta-subtitle">Spatial distribution of fatal violations stemming from Landmines, UXO, and Armored Vehicle Collisions. Database source: <em>Hafıza Merkezi ("Adalet İyileştirir")</em>.</p>
  </header>

  <div class="ucdp-grid">

    <div class="panel">

      <div class="panel-title">
        <span>INCIDENT SEARCH</span>
        <span class="case-count-badge" id="caseCount">51 CASES</span>
      </div>

      <div class="filter-group">
        <input type="text" id="searchInput" placeholder="Search by name, district, or province...">

        <select id="categoryFilter">
          <option value="">All Violation Types</option>
          <option value="Landmines & UXO Explosions">Landmines & UXO Explosions (28)</option>
          <option value="Armored Vehicle Collisions">Armored Vehicle Collisions (23)</option>
        </select>

        <select id="provinceFilter">
          <option value="">All Affected Provinces</option>
        </select>
      </div>

      <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('list')" id="tabBtnList">Case Records</button>
        <button class="tab-btn" onclick="switchTab('analytics')" id="tabBtnAnalytics">Analytics</button>
      </div>

      <div id="tabList" class="incident-scroll-list"></div>

      <div id="tabAnalytics" class="incident-scroll-list" style="display: none;">
        <div style="margin-bottom: 20px;">

        </div>

          <div style="height: 160px;"><canvas id="yearChart"></canvas></div>
        </div>
      </div>
    </div>

    <div class="map-box">
      <div id="map"></div>
    </div>

  </div>

    const stripPhotos = [

      ["ceylan", "Ceylan"], ["diren", "Diren"], ["hasan", "Hasan"],
      ["maziye-", "Maziye"], ["masuk", "Maşuk"], ["sahin", "Şahin"],
      ["omer", "Ömer"], ["sevim", "Sevim"], ["yahya", "Yahya"],
      ["zahir", "Zahir"], ["zeynep", "Zeynep"]

    const photoExts = ["jpg", "jpeg", "JPG", "JPEG", "png", "PNG", "webp"];

    (function buildStrip() {
      const track = document.getElementById("stripTrack");
      stripPhotos.forEach(([base, alt]) => {
        const item = document.createElement("div");
        item.className = "strip-item";

        const img = document.createElement("img");
        img.alt = alt;
        img.loading = "lazy";

        let i = 0;
        img.onerror = () => {
          i++;
          if (i < photoExts.length) {
            img.src = `${base}.${photoExts[i]}`;
          } else {
            console.warn(`No image found for "${base}" (tried: ${photoExts.join(", ")})`);
            item.remove();
          }
        };
        img.src = `${base}.${photoExts[0]}`;

        item.appendChild(img);
        track.appendChild(item);
      });
    })();

    map.addLayer(markersCluster);

    Object.keys(provinceCoords).sort().forEach(p => {

    function render(data) {
      markersCluster.clearLayers();
      const list = document.getElementById('tabList');
      list.innerHTML = '';
      document.getElementById('caseCount').textContent = `${data.length} CASES`;

        const baseCoord = provinceCoords[inc.province] || [38.5, 41.5];
        const lat = baseCoord[0] + (Math.random() - 0.5) * 0.12;
        const lng = baseCoord[1] + (Math.random() - 0.5) * 0.12;
        const isMine = inc.type.includes("Landmines");
        const color = isMine ? "#a81c1c" : "#b45309";

          radius: 6, fillColor: color, color: "#ffffff", weight: 1.5, fillOpacity: 0.95
        });

        marker.bindPopup(`
          <div style="font-family: Georgia, serif; font-size: 14px;">
            <strong style="color: #a81c1c;">${inc.name} (${inc.age})</strong><br>
            <span style="font-size: 12px; color: #555;">${inc.province}, ${inc.district} &bull; ${inc.date}</span>
            <p style="font-size: 12px; margin-top: 4px;">${inc.desc}</p>
          </div>
        `);
        markersCluster.addLayer(marker);

        const card = document.createElement('div');
        card.className = "incident-card";
        card.innerHTML = `
          <div class="card-title">${inc.name} (${inc.age})</div>
          <div class="card-meta">${inc.province}, ${inc.district} &bull; ${inc.date}</div>
          <div style="font-size: 11px; margin-top: 4px; color: ${color}; font-family: monospace;">${inc.type}</div>
        `;
        card.onclick = () => { map.setView([lat, lng], 10); marker.openPopup(); };
        list.appendChild(card);
      });

      updateCharts(data);
    }

    function updateCharts(data) {
      const catCounts = { "Landmines & UXO Explosions": 0, "Armored Vehicle Collisions": 0 };
      const yrCounts = {}; for (let y = 2000; y <= 2015; y++) yrCounts[y] = 0;

      data.forEach(inc => {
        if (catCounts[inc.type] !== undefined) catCounts[inc.type]++;
        const yr = inc.date.split('.')[2];
        if (yrCounts[yr] !== undefined) yrCounts[yr]++;
      });

      if (catChart) catChart.destroy();
      catChart = new Chart(document.getElementById('categoryChart'), {
        type: 'doughnut',
        data: { labels: Object.keys(catCounts), datasets: [{ data: Object.values(catCounts), backgroundColor: ['#a81c1c', '#b45309'] }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } } }
      });

      if (yrChart) yrChart.destroy();
      yrChart = new Chart(document.getElementById('yearChart'), {
        type: 'bar',
        data: { labels: Object.keys(yrCounts), datasets: [{ data: Object.values(yrCounts), backgroundColor: '#a81c1c' }] },
        options: { responsive: true, maintainAspectRatio: false, scales: { x: { ticks: { font: { size: 9 } } }, y: { ticks: { font: { size: 9 } } } }, plugins: { legend: { display: false } } }
      });
    }

    function filterData() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const c = document.getElementById('categoryFilter').value;
      const p = document.getElementById('provinceFilter').value;

      const filtered = incidents.filter(i =>
        (i.name.toLowerCase().includes(q) || i.province.toLowerCase().includes(q) || i.district.toLowerCase().includes(q) || i.date.includes(q)) &&
        (!c || i.type === c) && (!p || i.province === p)
      );
      render(filtered);
    }

    function searchByName(nameQuery) {
      const searchInput = document.getElementById('searchInput');
      searchInput.value = nameQuery;
      filterData();
      switchTab('list');
    }

    document.getElementById('searchInput').addEventListener('input', filterData);
    document.getElementById('categoryFilter').addEventListener('change', filterData);
    document.getElementById('provinceFilter').addEventListener('change', filterData);

    function switchTab(t) {
      const isList = t === 'list';
      document.getElementById('tabList').style.display = isList ? 'flex' : 'none';
      document.getElementById('tabAnalytics').style.display = isList ? 'none' : 'flex';
      document.getElementById('tabBtnList').className = isList ? 'tab-btn active' : 'tab-btn';
      document.getElementById('tabBtnAnalytics').className = isList ? 'tab-btn' : 'tab-btn active';
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      document.getElementById('themeBtn').textContent = theme === 'dark' ? '☀️ light' : '🌙 dark';
    }

    function toggleTheme() {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    }

    window.addEventListener('load', () => {
      try {
        const saved = localStorage.getItem('theme');
        if (saved) applyTheme(saved);
      } catch (e) {}
      render(incidents);
      setTimeout(() => map.invalidateSize(), 200);
    });
  </script>
</body>
</html>
