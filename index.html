  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧿</text></svg>">
  <style>
    /* CSS Variables for Light and Dark Modes */
    :root {
      --bg-color: #ffffff;
      --text-color: #000000;
      --link-color: blue;
      --contact-link-color: #333333;
      --border-color: #f0f0f0;
      --button-bg: #efefef;
      --button-border: #767676;
      --img-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    [data-theme="dark"] {
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --link-color: #64b5f6;
      --contact-link-color: #cccccc;
      --border-color: #333333;
      --button-bg: #2b2b2b;
      --button-border: #555555;
      --img-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    body { 
      font-family: "Helvetica", "Arial", sans-serif; 
      background-color: var(--bg-color); 
      color: var(--text-color);
      margin: 100px; 
      font-size: 20px; 
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    
    h1 {
      font-size: 40px; 
      margin-top: 0;
    }

    p { 
      margin: 20px 0; 
      font-size: 20px; 
    }

    a { 
      color: var(--link-color); 
      text-decoration: underline; 
      font-size: 20px;
    }

    /* Theme Toggle Positioned Top-Right */
    .theme-toggle-container {
      position: absolute;
      top: 40px;
      right: 100px;
    }

    /* Main two-column layout */
    .container {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 60px;
    }

    .main-content {
      flex: 1;
    }

    /* Right column holding both picture and quotes stacked vertically */
    .right-column {
      flex: 1;
      border-left: 2px solid var(--border-color);
      padding-left: 40px;
      display: flex;
      flex-direction: column;
      gap: 50px;
    }

    /* Profile picture styling */
    .profile-pic {
      width: 100%;
      max-width: 180px; 
      border-radius: 12px; 
      box-shadow: var(--img-shadow); 
      object-fit: cover; 
    }

    /* Custom styles for social links */
    .contact-link {
      font-family: "Consolas", "Courier New", monospace; 
      text-decoration: none;
      color: var(--contact-link-color);
      font-weight: 500;
    }

    .contact-link:hover {
      text-decoration: underline;
      color: var(--link-color);
    }

    #quote-box {
      font-size: 22px; 
      font-weight: bold;
      margin-top: 0;
    }

    button {
      font-size: 16px; 
      padding: 8px 16px;
      cursor: pointer;
      background-color: var(--button-bg);
      color: var(--text-color);
      border: 1px solid var(--button-border);
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="theme-toggle-container">
    <button id="theme-toggle" onclick="toggleTheme()">🌙 dark</button>
  </div>

  <!-- Two-column container -->
  <div class="container">
    
    <!-- LEFT COLUMN: Welcome, Bio, and Links -->
    <div class="main-content">

      </p>
      <p>

      </p>
      <p>

      </p>
      <p>

      </p>
      
      <br>
      
      <p><a href="projects.html">projects</a></p>
      <p><a href="questions.html">questions</a></p>
      <p><a href="blog.html">blog</a></p>
    </div>

    <!-- RIGHT COLUMN: Picture at top, Quotes below -->
    <div class="right-column">
      
      <!-- Picture Section -->
      <div class="picture-section">
        <img src="zeynep.jpeg" alt="Zeynep Kalaça" class="profile-pic">
      </div>

      <!-- Quote Section -->
      <div class="quote-section">
        <p id="quote-box"></p>
        <button onclick="newQuote()">new quote</button>
      </div>

    </div>
  </div>

  <script>
    // Theme Switcher Logic
    const toggleBtn = document.getElementById('theme-toggle');
    const currentTheme = localStorage.getItem('theme');

    if (currentTheme) {
      document.documentElement.setAttribute('data-theme', currentTheme);
      if (currentTheme === 'dark') {
        toggleBtn.textContent = '☀️ light';
      }
    }

    function toggleTheme() {
      let theme = document.documentElement.getAttribute('data-theme');
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('theme', 'light');
        toggleBtn.textContent = '🌙 dark';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        toggleBtn.textContent = '☀️ light';
      }
    }

    // Quote Logic
    const quotes = [
      "Nobody's perfect. - Some Like It Hot, 1959",
      "The greatest trick the devil ever pulled was convincing the world he didn't exist. - The Usual Suspects, 1995",
      "You can't handle the truth! - A Few Good Men, 1992",
      "What we've got here is a failure to communicate. - Cool Hand Luke, 1967",
      "I drink your milkshake! - There Will Be Blood, 2007",
      "Roads? Where we're going we don't need roads. - Back to the Future, 1985",
      "I don't want to survive. I want to live. - 12 Years a Slave, 2013",
      "I have always depended on the kindness of strangers. - A Streetcar Named Desire, 1951",
      "You have meddled with the primal forces of nature, Mr. Hamlin, and I won't have it. - Network, 1976",
      "Pay no attention to that man behind the curtain! - The Wizard of Oz, 1939",
    ];

    function newQuote() {
      const box = document.getElementById('quote-box');
      let next;
      do {
        next = quotes[Math.floor(Math.random() * quotes.length)];
      } while (next === box.textContent && quotes.length > 1);
      box.textContent = next;
    }

    newQuote();
  </script>
</body>
</html>
