<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeynep Kalaça / marmara region: oiz & work accidents</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧿</text></svg>">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #000000;
      --link-color: blue;
      --contact-link-color: #333333;
      --border-color: #ccc;
      --button-bg: #efefef;
      --button-border: #767676;
      --accent-color: #cc0000;
      --header-color: #1a3a5a;
      --card-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    [data-theme="dark"] {
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --link-color: #64b5f6;
      --contact-link-color: #cccccc;
      --border-color: #333333;
      --button-bg: #2b2b2b;
      --button-border: #555555;
      --accent-color: #ff6666;
      --header-color: #64b5f6;
      --card-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    body { 
      font-family: "Helvetica", "Arial", sans-serif; 
      background-color: var(--bg-color); 
      color: var(--text-color);
      margin: 60px 100px; 
      font-size: 20px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    h2 { 
      color: var(--header-color); 
      font-size: 32px;
      margin-bottom: 20px; 
    }

    p {
      margin: 30px 0;
      font-size: 20px;
    }

    #map { 
      height: 700px; 
      width: 100%; 
      border-radius: 12px; 
      box-shadow: var(--card-shadow);
      border: 1px solid var(--border-color);
    }

    [data-theme="dark"] .leaflet-tile-pane {
      filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3);
    }

    [data-theme="dark"] .leaflet-popup-content-wrapper,
    [data-theme="dark"] .leaflet-popup-tip {
      background-color: #2b2b2b;
      color: #e0e0e0;
    }

    .theme-toggle-container {
      position: absolute;
      top: 40px;
      right: 100px;
    }

    .back-link {
      font-family: "Consolas", "Courier New", monospace; 
      text-decoration: none;
      color: var(--contact-link-color);
      font-weight: 500;
      display: inline-block;
    }

    .back-link:hover {
      text-decoration: underline;
      color: var(--link-color);
    }

    hr {
      border: 0;
      border-top: 1px solid var(--border-color);
      margin: 30px 0;
    }

    button {
      font-size: 16px; 
      padding: 8px 16px;
      cursor: pointer;
      background-color: var(--button-bg);
      color: var(--text-color);
      border: 1px solid var(--button-border);
      border-radius: 4px;
    }

    @media (max-width: 768px) {
      body {
        margin: 30px 20px;
      }
      .theme-toggle-container {
        top: 20px;
        right: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="theme-toggle-container">
    <button id="theme-toggle" onclick="toggleTheme()">🌙 dark</button>
  </div>

  <h2>marmara region: oiz & work accidents</h2>
  <p><a href="index.html" class="back-link">← home</a></p>
  <hr>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Theme Switcher
    const toggleBtn = document.getElementById('theme-toggle');
    const currentTheme = localStorage.getItem('theme');

    if (currentTheme) {
      document.documentElement.setAttribute('data-theme', currentTheme);
      if (currentTheme === 'dark') {
        toggleBtn.textContent = '☀️ light';
      }
    }

    function toggleTheme() {
      let theme = document.documentElement.getAttribute('data-theme');
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('theme', 'light');
        toggleBtn.textContent = '🌙 dark';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        toggleBtn.textContent = '☀️ light';
      }
    }

    // Map Initialization
    var map = L.map('map').setView([40.8, 28.5], 7.5);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // 1. City Centers & Work Incident Statistics
    var cityAccidentData = [
      {
        city: "İstanbul",
        coords: [41.0082, 28.9784],
        constructionAccidents2023: 22541,
        constructionDeaths2023: 112,
        avgAccidents01_05: 9145.6,
        avgDeaths01_05: 154.8
      },
      {
        city: "Bursa",
        coords: [40.1885, 29.0610],
        constructionAccidents2023: 2417,
        constructionDeaths2023: 10,
        avgAccidents01_05: 6762.0,
        avgDeaths01_05: 43.2
      },
      {
        city: "Kocaeli",
        coords: [40.8533, 29.8815],
        constructionAccidents2023: 2509,
        constructionDeaths2023: 12,
        avgAccidents01_05: 6562.6,
        avgDeaths01_05: 32.8
      },
      {
        city: "Tekirdağ",
        coords: [40.9833, 27.5167],
        constructionAccidents2023: 787,
        constructionDeaths2023: "N/A",
        avgAccidents01_05: 2180.4,
        avgDeaths01_05: 17.6
      },
      {
        city: "Bilecik",
        coords: [40.1500, 29.9833],
        constructionAccidents2023: 348,
        constructionDeaths2023: "N/A",
        avgAccidents01_05: 1585.4,
        avgDeaths01_05: 5.4
      },
      {
        city: "Balıkesir",
        coords: [39.6484, 27.8826],
        constructionAccidents2023: 733,
        constructionDeaths2023: 13,
        avgAccidents01_05: 1289.4,
        avgDeaths01_05: 14.6
      },
      {
        city: "Kırklareli",
        coords: [41.7333, 27.2167],
        constructionAccidents2023: 454,
        constructionDeaths2023: "N/A",
        avgAccidents01_05: 1112.6,
        avgDeaths01_05: 7.6
      },
      {
        city: "Sakarya",
        coords: [40.7569, 30.3783],
        constructionAccidents2023: 930,
        constructionDeaths2023: "N/A",
        avgAccidents01_05: 625.0,
        avgDeaths01_05: 13.2
      },
      {
        city: "Çanakkale",
        coords: [40.1553, 26.4142],
        constructionAccidents2023: 432,
        constructionDeaths2023: "N/A",
        avgAccidents01_05: 398.6,
        avgDeaths01_05: 6.0
      },
      {
        city: "Yalova",
        coords: [40.6500, 29.2667],
        constructionAccidents2023: 323,
        constructionDeaths2023: "N/A",
        avgAccidents01_05: 201.6,
        avgDeaths01_05: 3.0
      },
      {
        city: "Edirne",
        coords: [41.6772, 26.5557],
        constructionAccidents2023: 128,
        constructionDeaths2023: "N/A",
        avgAccidents01_05: 223.0,
        avgDeaths01_05: 6.0
      }
    ];

    // Render Red City Markers for Accidents
    cityAccidentData.forEach(function(item) {
      var popupContent = "<strong>" + item.city + " (City Center)</strong><br><hr style='margin:5px 0;'>" +
        "<b>2023 Construction Accidents:</b> " + item.constructionAccidents2023 + "<br>" +
        "<b>2023 Construction Deaths:</b> " + item.constructionDeaths2023 + "<br>" +
        "<b>2001-2005 Avg. Accidents/Yr:</b> " + item.avgAccidents01_05 + "<br>" +
        "<b>2001-2005 Avg. Deaths/Yr:</b> " + item.avgDeaths01_05;

      L.circleMarker(item.coords, {
        radius: 12,
        fillColor: "#e74c3c",
        color: "#ffffff",
        weight: 2,
        fillOpacity: 0.9
      }).bindPopup(popupContent).addTo(map);
    });

    // 2. Load OIZ Points from GeoJSON
    var geojsonUrl = 'https://raw.githubusercontent.com/zeynepkalaca/zeynepkalaca.github.io/refs/heads/main/marmara.geojson';

    fetch(geojsonUrl)
        .then(response => response.json())
        .then(data => {
            var oizLayer = L.geoJSON(data, {
                onEachFeature: function (feature, layer) {
                    let props = feature.properties;
                    let name = props["Name of the Organized Industrial Zone"] || "N/A";
                    let province = props["Province"] || "Marmara Region";

                    if (province !== "CSVFilter") {
                        layer.bindPopup(
                            "<strong>" + name + "</strong><br>" +
                            "Province: " + province
                        );
                    }
                },
                pointToLayer: function (feature, latlng) {
                    return L.circleMarker(latlng, {
                        radius: 6,
                        fillColor: "#2980b9",
                        color: "#fff",
                        weight: 1.5,
                        fillOpacity: 0.85
                    });
                }
            }).addTo(map);
        })
        .catch(error => console.error('Error loading GeoJSON:', error));
  </script>
</body>
</html>
