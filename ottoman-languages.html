<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeynep Kalaça / ottoman empire: spoken languages</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧿</text></svg>">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    /* CSS Variables for Light and Dark Modes */
    :root {
      --bg-color: #ffffff;
      --text-color: #000000;
      --link-color: blue;
      --contact-link-color: #333333;
      --border-color: #ccc;
      --button-bg: #efefef;
      --button-border: #767676;
      --accent-color: #cc0000;
      --header-color: #1a3a5a;
      --card-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    [data-theme="dark"] {
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --link-color: #64b5f6;
      --contact-link-color: #cccccc;
      --border-color: #333333;
      --button-bg: #2b2b2b;
      --button-border: #555555;
      --accent-color: #ff6666;
      --header-color: #64b5f6;
      --card-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    body { 
      font-family: "Helvetica", "Arial", sans-serif; 
      background-color: var(--bg-color); 
      color: var(--text-color);
      margin: 60px 100px; 
      font-size: 20px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    h2 { 
      color: var(--header-color); 
      font-size: 32px;
      margin-bottom: 20px; 
    }

    p {
      margin: 30px 0;
      font-size: 20px;
    }

    p.subtitle {
      font-size: 18px;
      color: var(--contact-link-color);
      margin-top: -15px;
      margin-bottom: 25px;
    }

    #map { 
      height: 700px; 
      width: 100%; 
      border-radius: 12px; 
      box-shadow: var(--card-shadow);
      border: 1px solid var(--border-color);
    }

    /* Dark mode styling for Leaflet map tiles and popups */
    [data-theme="dark"] .leaflet-tile-pane {
      filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3);
    }

    [data-theme="dark"] .leaflet-popup-content-wrapper,
    [data-theme="dark"] .leaflet-popup-tip {
      background-color: #2b2b2b;
      color: #e0e0e0;
    }

    /* Theme Toggle Positioned Top-Right */
    .theme-toggle-container {
      position: absolute;
      top: 40px;
      right: 100px;
    }

    .back-link {
      font-family: "Consolas", "Courier New", monospace; 
      text-decoration: none;
      color: var(--contact-link-color);
      font-weight: 500;
      display: inline-block;
    }

    .back-link:hover {
      text-decoration: underline;
      color: var(--link-color);
    }

    hr {
      border: 0;
      border-top: 1px solid var(--border-color);
      margin: 30px 0;
    }

    button {
      font-size: 16px; 
      padding: 8px 16px;
      cursor: pointer;
      background-color: var(--button-bg);
      color: var(--text-color);
      border: 1px solid var(--button-border);
      border-radius: 4px;
    }

    @media (max-width: 768px) {
      body {
        margin: 30px 20px;
      }
      .theme-toggle-container {
        top: 20px;
        right: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Theme Toggle -->
  <div class="theme-toggle-container">
    <button id="theme-toggle" onclick="toggleTheme()">🌙 dark</button>
  </div>

  <h2>ottoman empire: spoken languages</h2>
  <p><a href="index.html" class="back-link">← home</a></p>
  <p class="subtitle">linguistic distribution and language families across major ottoman urban centers.</p>
  <hr>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Theme Switcher Logic (Identical to marmara.html)
    const toggleBtn = document.getElementById('theme-toggle');
    const currentTheme = localStorage.getItem('theme');

    if (currentTheme) {
      document.documentElement.setAttribute('data-theme', currentTheme);
      if (currentTheme === 'dark') {
        toggleBtn.textContent = '☀️ light';
      }
    }

    function toggleTheme() {
      let theme = document.documentElement.getAttribute('data-theme');
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('theme', 'light');
        toggleBtn.textContent = '🌙 dark';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        toggleBtn.textContent = '☀️ light';
      }
    }

    // Leaflet Map Initialization
    var map = L.map('map').setView([37.0, 32.0], 5);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // GeoJSON Data
    const geojsonData = {
        "type": "FeatureCollection",
        "features": [
            {
                "type": "Feature",
                "geometry": { "type": "Point", "coordinates": [22.9444, 40.6401] },
                "properties": {
                    "location_name": "Salonica / Selanik",
                    "primary_language": "Ladino (Judeo-Spanish)",
                    "secondary_languages": "Ottoman Turkish, Greek, Bulgarian",
                    "language_family": "Romance",
                    "source_citation": "Cuinet (1892), Vol 3, p. 12"
                }
            },
            {
                "type": "Feature",
                "geometry": { "type": "Point", "coordinates": [28.9784, 41.0082] },
                "properties": {
                    "location_name": "Istanbul / Dersaadet",
                    "primary_language": "Ottoman Turkish",
                    "secondary_languages": "Greek, Armenian, Ladino, French",
                    "language_family": "Turkic",
                    "source_citation": "Karpat (1985), p. 102"
                }
            },
            {
                "type": "Feature",
                "geometry": { "type": "Point", "coordinates": [27.1428, 38.4237] },
                "properties": {
                    "location_name": "Smyrna / Izmir",
                    "primary_language": "Greek",
                    "secondary_languages": "Ottoman Turkish, Ladino, French, Armenian",
                    "language_family": "Hellenic",
                    "source_citation": "Cuinet (1892), Vol 3, p. 340"
                }
            },
            {
                "type": "Feature",
                "geometry": { "type": "Point", "coordinates": [44.3661, 33.3152] },
                "properties": {
                    "location_name": "Baghdad",
                    "primary_language": "Arabic",
                    "secondary_languages": "Ottoman Turkish, Persian, Judeo-Arabic, Syriac",
                    "language_family": "Semitic",
                    "source_citation": "Cuinet (1892), Vol 3, p. 18"
                }
            },
            {
                "type": "Feature",
                "geometry": { "type": "Point", "coordinates": [37.1343, 36.2021] },
                "properties": {
                    "location_name": "Aleppo / Halab",
                    "primary_language": "Arabic",
                    "secondary_languages": "Ottoman Turkish, Armenian, Judeo-Arabic",
                    "language_family": "Semitic",
                    "source_citation": "Cuinet (1891), Vol 2, p. 112"
                }
            },
            {
                "type": "Feature",
                "geometry": { "type": "Point", "coordinates": [43.1300, 36.3400] },
                "properties": {
                    "location_name": "Mosul",
                    "primary_language": "Arabic",
                    "secondary_languages": "Kurdish, Syriac (Neo-Aramaic), Ottoman Turkish",
                    "language_family": "Semitic",
                    "source_citation": "Cuinet (1892), Vol 3, p. 760"
                }
            },
            {
                "type": "Feature",
                "geometry": { "type": "Point", "coordinates": [36.2765, 33.5138] },
                "properties": {
                    "location_name": "Damascus / Şam",
                    "primary_language": "Arabic",
                    "secondary_languages": "Ottoman Turkish, Judeo-Arabic",
                    "language_family": "Semitic",
                    "source_citation": "Cuinet (1891), Vol 2, p. 250"
                }
            },
            {
                "type": "Feature",
                "geometry": { "type": "Point", "coordinates": [35.5018, 33.8938] },
                "properties": {
                    "location_name": "Beirut",
                    "primary_language": "Arabic",
                    "secondary_languages": "French, Ottoman Turkish, Greek",
                    "language_family": "Semitic",
                    "source_citation": "Cuinet (1896), Vol 4, p. 55"
                }
            },
            {
                "type": "Feature",
                "geometry": { "type": "Point", "coordinates": [26.5557, 41.6771] },
                "properties": {
                    "location_name": "Edirne / Adrianople",
                    "primary_language": "Ottoman Turkish",
                    "secondary_languages": "Ladino, Greek, Bulgarian",
                    "language_family": "Turkic",
                    "source_citation": "Cuinet (1892), Vol 1, p. 620"
                }
            },
            {
                "type": "Feature",
                "geometry": { "type": "Point", "coordinates": [21.3347, 41.0311] },
                "properties": {
                    "location_name": "Monastir / Bitola",
                    "primary_language": "Bulgarian",
                    "secondary_languages": "Ottoman Turkish, Aromanian, Greek, Albanian",
                    "language_family": "Slavic",
                    "source_citation": "Brailsford (1906), p. 85"
                }
            },
            {
                "type": "Feature",
                "geometry": { "type": "Point", "coordinates": [19.5121, 42.0693] },
                "properties": {
                    "location_name": "Scutari / Shkodër",
                    "primary_language": "Albanian",
                    "secondary_languages": "Ottoman Turkish, Serbo-Croatian",
                    "language_family": "Indo-European",
                    "source_citation": "Gopčević (1889), p. 42"
                }
            },
            {
                "type": "Feature",
                "geometry": { "type": "Point", "coordinates": [31.2357, 30.0444] },
                "properties": {
                    "location_name": "Cairo / Kahire",
                    "primary_language": "Arabic",
                    "secondary_languages": "Ottoman Turkish, French, Judeo-Arabic",
                    "language_family": "Semitic",
                    "source_citation": "Lane (1836), p. 14"
                }
            }
        ]
    };

    L.geoJSON(geojsonData, {
        onEachFeature: function (feature, layer) {
            const props = feature.properties;
            const popupContent = `
                <strong>${props.location_name}</strong><br>
                <b>Primary Language:</b> ${props.primary_language}<br>
                <b>Secondary:</b> ${props.secondary_languages}<br>
                <b>Family:</b> ${props.language_family}<br>
                <small><i>Source: ${props.source_citation}</i></small>
            `;
            layer.bindPopup(popupContent);
        }
    }).addTo(map);
  </script>
</body>
</html>
