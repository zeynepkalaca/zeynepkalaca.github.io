<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ottoman empire: spoken languages</title>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧿</text></svg>">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --primary-color: #1b4332;
            --bg-color: #ffffff;
            --text-color: #212529;
            --subtitle-color: #6c757d;
            --card-shadow: rgba(0, 0, 0, 0.08);
            --toggle-bg: #e9ecef;
            --toggle-text: #212529;
        }

        [data-theme="dark"] {
            --primary-color: #52b788;
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --subtitle-color: #a0a0a0;
            --card-shadow: rgba(0, 0, 0, 0.5);
            --toggle-bg: #2d2d2d;
            --toggle-text: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 40px;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
        }

        .header-title {
            flex-grow: 1;
        }

        h1 {
            color: var(--primary-color);
            font-size: 2rem;
            margin: 0 0 8px 0;
            font-weight: 700;
            transition: color 0.3s ease;
        }

        p.subtitle {
            color: var(--subtitle-color);
            margin: 0;
            font-size: 1rem;
            transition: color 0.3s ease;
        }

        .theme-toggle {
            background-color: var(--toggle-bg);
            color: var(--toggle-text);
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .theme-toggle:hover {
            opacity: 0.9;
        }

        #map {
            width: 100%;
            height: 520px;
            border-radius: 8px;
            box-shadow: 0 4px 12px var(--card-shadow);
            transition: box-shadow 0.3s ease;
        }

        /* Leaflet Dark Theme Overrides */
        [data-theme="dark"] .leaflet-popup-content-wrapper,
        [data-theme="dark"] .leaflet-popup-tip {
            background-color: #1e1e1e;
            color: #e0e0e0;
        }

        .leaflet-popup-content strong {
            font-size: 1.05em;
        }

        [data-theme="dark"] .leaflet-popup-content strong {
            color: #52b788;
        }

        [data-theme="light"] .leaflet-popup-content strong {
            color: #1b4332;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-title">
            <h1>ottoman empire: spoken languages</h1>
            <p class="subtitle">linguistic distribution and language families across major ottoman urban centers.</p>
        </div>
        <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">
            <span id="theme-icon">🌙</span> <span id="theme-text">dark Mode</span>
        </button>
    </header>

    <!-- Map Container -->
    <div id="map"></div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // 1. Embedded GeoJSON Data
    const geojsonData = {
        "type": "FeatureCollection",
        "features": [
            {
                "type": "Feature",
                "geometry": { "type": "Point", "coordinates": [22.9444, 40.6401] },
                "properties": {
                    "location_name": "Salonica / Selanik",
                    "primary_language": "Ladino (Judeo-Spanish)",
                    "secondary_languages": "Ottoman Turkish, Greek, Bulgarian",
                    "language_family": "Romance",
                    "source_citation": "Cuinet (1892), Vol 3, p. 12"
                }
            },
            {
                "type": "Feature",
                "geometry": { "type": "Point", "coordinates": [28.9784, 41.0082] },
                "properties": {
                    "location_name": "Istanbul / Dersaadet",
                    "primary_language": "Ottoman Turkish",
                    "secondary_languages": "Greek, Armenian, Ladino, French",
                    "language_family": "Turkic",
                    "source_citation": "Karpat (1985), p. 102"
                }
            },
            {
                "type": "Feature",
                "geometry": { "type": "Point", "coordinates": [27.1428, 38.4237] },
                "properties": {
                    "location_name": "Smyrna / Izmir",
                    "primary_language": "Greek",
                    "secondary_languages": "Ottoman Turkish, Ladino, French, Armenian",
                    "language_family": "Hellenic",
                    "source_citation": "Cuinet (1892), Vol 3, p. 340"
                }
            },
            {
                "type": "Feature",
                "geometry": { "type": "Point", "coordinates": [44.3661, 33.3152] },
                "properties": {
                    "location_name": "Baghdad",
                    "primary_language": "Arabic",
                    "secondary_languages": "Ottoman Turkish, Persian, Judeo-Arabic, Syriac",
                    "language_family": "Semitic",
                    "source_citation": "Cuinet (1892), Vol 3, p. 18"
                }
            },
            {
                "type": "Feature",
                "geometry": { "type": "Point", "coordinates": [37.1343, 36.2021] },
                "properties": {
                    "location_name": "Aleppo / Halab",
                    "primary_language": "Arabic",
                    "secondary_languages": "Ottoman Turkish, Armenian, Judeo-Arabic",
                    "language_family": "Semitic",
                    "source_citation": "Cuinet (1891), Vol 2, p. 112"
                }
            },
            {
                "type": "Feature",
                "geometry": { "type": "Point", "coordinates": [43.1300, 36.3400] },
                "properties": {
                    "location_name": "Mosul",
                    "primary_language": "Arabic",
                    "secondary_languages": "Kurdish, Syriac (Neo-Aramaic), Ottoman Turkish",
                    "language_family": "Semitic",
                    "source_citation": "Cuinet (1892), Vol 3, p. 760"
                }
            },
            {
                "type": "Feature",
                "geometry": { "type": "Point", "coordinates": [36.2765, 33.5138] },
                "properties": {
                    "location_name": "Damascus / Şam",
                    "primary_language": "Arabic",
                    "secondary_languages": "Ottoman Turkish, Judeo-Arabic",
                    "language_family": "Semitic",
                    "source_citation": "Cuinet (1891), Vol 2, p. 250"
                }
            },
            {
                "type": "Feature",
                "geometry": { "type": "Point", "coordinates": [35.5018, 33.8938] },
                "properties": {
                    "location_name": "Beirut",
                    "primary_language": "Arabic",
                    "secondary_languages": "French, Ottoman Turkish, Greek",
                    "language_family": "Semitic",
                    "source_citation": "Cuinet (1896), Vol 4, p. 55"
                }
            },
            {
                "type": "Feature",
                "geometry": { "type": "Point", "coordinates": [26.5557, 41.6771] },
                "properties": {
                    "location_name": "Edirne / Adrianople",
                    "primary_language": "Ottoman Turkish",
                    "secondary_languages": "Ladino, Greek, Bulgarian",
                    "language_family": "Turkic",
                    "source_citation": "Cuinet (1892), Vol 1, p. 620"
                }
            },
            {
                "type": "Feature",
                "geometry": { "type": "Point", "coordinates": [21.3347, 41.0311] },
                "properties": {
                    "location_name": "Monastir / Bitola",
                    "primary_language": "Bulgarian",
                    "secondary_languages": "Ottoman Turkish, Aromanian, Greek, Albanian",
                    "language_family": "Slavic",
                    "source_citation": "Brailsford (1906), p. 85"
                }
            },
            {
                "type": "Feature",
                "geometry": { "type": "Point", "coordinates": [19.5121, 42.0693] },
                "properties": {
                    "location_name": "Scutari / Shkodër",
                    "primary_language": "Albanian",
                    "secondary_languages": "Ottoman Turkish, Serbo-Croatian",
                    "language_family": "Indo-European",
                    "source_citation": "Gopčević (1889), p. 42"
                }
            },
            {
                "type": "Feature",
                "geometry": { "type": "Point", "coordinates": [31.2357, 30.0444] },
                "properties": {
                    "location_name": "Cairo / Kahire",
                    "primary_language": "Arabic",
                    "secondary_languages": "Ottoman Turkish, French, Judeo-Arabic",
                    "language_family": "Semitic",
                    "source_citation": "Lane (1836), p. 14"
                }
            }
        ]
    };

    // 2. Initialize Map
    const map = L.map('map').setView([37.0, 32.0], 5);

    // Tile Layers for Light and Dark modes
    const lightTiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    });

    const darkTiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
    });

    // Default to light tiles
    lightTiles.addTo(map);

    // 3. Add GeoJSON Markers
    L.geoJSON(geojsonData, {
        onEachFeature: function (feature, layer) {
            const props = feature.properties;
            const popupContent = `
                <strong>${props.location_name}</strong><br>
                <b>Primary Language:</b> ${props.primary_language}<br>
                <b>Secondary:</b> ${props.secondary_languages}<br>
                <b>Family:</b> ${props.language_family}<br>
                <small><i>Source: ${props.source_citation}</i></small>
            `;
            layer.bindPopup(popupContent);
        }
    }).addTo(map);

    // 4. Dark/Light Theme Switching Logic
    function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');

        if (theme === 'dark') {
            map.removeLayer(lightTiles);
            darkTiles.addTo(map);
            themeIcon.textContent = '☀️';
            themeText.textContent = 'light';
        } else {
            map.removeLayer(darkTiles);
            lightTiles.addTo(map);
            themeIcon.textContent = '🌙';
            themeText.textContent = 'dark';
        }
        localStorage.setItem('theme', theme);
    }

    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        setTheme(newTheme);
    }

    // Load saved user preference if present
    const savedTheme = localStorage.getItem('theme') || 'light';
    setTheme(savedTheme);
</script>

</body>
</html>
